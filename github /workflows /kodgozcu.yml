name: KodGözcü - AI Code Review

on:
  pull_request:
    types: [opened, synchronize]
    paths-ignore:
      - '**.lock'
      - '**.min.js'
      - '**.min.css'
      - 'dist/**'
      - 'package-lock.json'
      - 'yarn.lock'
      - 'pnpm-lock.yaml'

concurrency:
  group: kodgozcu-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write

jobs:
  review:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Get PR diff
        id: diff
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
          BASE_REF: ${{ github.base_ref }}
        run: |
          set -e
          git fetch --no-tags --depth=1 origin "$BASE_REF"
          git diff "origin/$BASE_REF...HEAD" > diff.txt || echo "" > diff.txt
          SIZE=$(wc -c < diff.txt)
          echo "DIFF_SIZE=$SIZE" >> $GITHUB_OUTPUT
          echo "Diff boyutu: $SIZE byte"

      - name: Too large - notify and skip
        if: steps.diff.outputs.DIFF_SIZE >= 100000
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
          SIZE: ${{ steps.diff.outputs.DIFF_SIZE }}
        run: |
          python3 - << 'PY'
          import os, requests
          size = int(os.environ['SIZE'])
          body = f"""## 👁️ KodGözcü

          ⚠️ Bu PR'ın diff'i çok büyük (**{size:,} byte** > 100.000 limit).
          Otomatik inceleme atlandı. Lütfen değişiklikleri daha küçük PR'lara bölün.

          ---
          <sub>🔧 KodGözcü v1.0</sub>"""
          requests.post(
              f"https://api.github.com/repos/{os.environ['REPO']}/issues/{os.environ['PR_NUMBER']}/comments",
              headers={"Authorization": f"token {os.environ['GH_TOKEN']}",
                       "Accept": "application/vnd.github.v3+json"},
              json={"body": body},
              timeout=30,
          )
          PY

      - name: Run KodGözcü AI Review
        if: steps.diff.outputs.DIFF_SIZE < 100000 && steps.diff.outputs.DIFF_SIZE > 0
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
        run: |
          pip install -q requests
          python3 << 'PYTHON_SCRIPT'
          import os, requests, time

          GH_LIMIT = 65000
          DIFF_LIMIT = 40000

          with open('diff.txt', encoding='utf-8', errors='replace') as f:
              diff = f.read()

          if not diff.strip():
              print("Diff boş, atlanıyor")
              raise SystemExit(0)

          truncated = len(diff) > DIFF_LIMIT
          diff_part = diff[:DIFF_LIMIT]

          prompt = f"""Sen kıdemli bir yazılım mühendisisin. Bu PR diff'ini incele:

          🔍 İnceleme Kriterleri:
          - 🐛 Bug ve mantık hataları
          - 🔒 Güvenlik açıkları
          - ⚡ Performans sorunları
          - 📝 Kod kalitesi ve okunabilirlik
          - 💡 İyileştirme önerileri

          Türkçe, kısa ve net yorumlar yaz. Markdown kullan.
          Kaliteliyse "LGTM ✅" de. Sorun varsa dosya adı ve satır belirt.
          Yanıtı 500 kelimeyi geçmeyecek şekilde tutarlı tut.

